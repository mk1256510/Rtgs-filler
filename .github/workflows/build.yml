name: Build APK

on:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install
      run: |
        sudo apt update
        sudo apt install -y python3-pip openjdk-17-jdk zip unzip
        pip install buildozer cython kivy

    - name: Init
      run: |
        buildozer init
        sed -i 's/^requirements =.*/requirements = python3,kivy/' buildozer.spec

    - name: Build
      run: |
        buildozer android debug

    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: apk
        path: bin/*.apk
